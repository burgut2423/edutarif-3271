[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Actual URL is loaded from DATABASE_URL in .env; tests can override via Config.attributes.
# This value is a fallback for local offline commands without .env.
sqlalchemy.url = sqlite:///./edutarif.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
