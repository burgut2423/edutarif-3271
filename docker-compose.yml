services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edutarif
      POSTGRES_USER: edutarif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env}
    volumes:
      - edutarif_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutarif -d edutarif"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edutarif:${POSTGRES_PASSWORD}@db:5432/edutarif
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  edutarif_db:
